name: Security Audit

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PNPM_HOME: /tmp/.pnpm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --store-dir /tmp/.pnpm-store --frozen-lockfile --no-optional

      - name: Production dependency audit
        run: pnpm audit --prod
