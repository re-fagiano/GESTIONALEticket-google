name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    env:
      PNPM_HOME: /tmp/.pnpm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --store-dir /tmp/.pnpm-store --no-frozen-lockfile --no-optional

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
