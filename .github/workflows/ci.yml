name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    env:
      PNPM_HOME: /tmp/.pnpm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --store-dir /tmp/.pnpm-store --no-frozen-lockfile --no-optional

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PNPM_HOME: /tmp/.pnpm
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - run: sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: npx eslint server tests
      - run: pnpm test

  security-checks:
    runs-on: ubuntu-latest
    env:
      PNPM_HOME: /tmp/.pnpm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --store-dir /tmp/.pnpm-store --no-frozen-lockfile --no-optional

      - name: Static security checks
        run: pnpm run security:static

      - name: Dependency security audit
        run: pnpm run security:audit

  prisma-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DATABASE_URL != ''
    env:
      PNPM_HOME: /tmp/.pnpm
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --store-dir /tmp/.pnpm-store --no-frozen-lockfile --no-optional

      - name: Run Prisma migrate deploy
        run: pnpm run prisma:deploy
